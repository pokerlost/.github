name: Documentation
on:
  push:
    branches: [test, dev, main]
  pull_request:
    branches: [test, dev, main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false, ref: '${{ github.event.pull_request.head.sha || github.sha }}'}
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Restore documentation tools only
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.quality
          target: quality
          load: true
          tags: community:quality
          cache-from: type=gha,scope=${{ github.repository_id }}-docs-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
          cache-to: type=gha,mode=max,scope=${{ github.repository_id }}-docs-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare real Python packaging regression fixtures
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            --disable-pip-version-check -r scripts/python-test-requirements.txt
      - uses: ./.github/actions/actionlint
      - run: make ci-local
      - run: cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
  release:
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release-allocation
      queue: max
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.0
      - run: node scripts/publish.mjs
        env:
          GH_TOKEN: ${{ github.token }}

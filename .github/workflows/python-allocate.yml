name: Reusable Python exact-event allocation
on:
  workflow_call:
    inputs:
      provider-ref:
        description: Reviewed full provider SHA, identical to this reusable workflow pin.
        required: true
        type: string
      schema-version:
        description: Exact supported contract schema, h02-python/v1.
        required: true
        type: string
      source-workflow:
        description: Original caller workflow path, including .github/workflows/.
        required: true
        type: string
      preflight-gate:
        description: Exact successful native preflight job name in this original run attempt.
        required: true
        type: string
      builder-job:
        description: Exact G01-owned native builder job name expected after allocation.
        required: true
        type: string
      package-name:
        description: Native Python distribution name; metadata must match it.
        required: true
        type: string
      version-target:
        description: Reviewed native release target in strict X.Y.Z SemVer form.
        required: true
        type: string
      wheel-tags:
        description: JSON array of the exact expected expanded PEP 425 compatibility tags.
        required: true
        type: string
    outputs:
      allocation:
        description: Immutable h02-python/v1 allocation JSON for the native builder and publisher.
        value: ${{ jobs.allocate.outputs.allocation }}
      allocation-sha256:
        description: SHA-256 of the exact allocation JSON.
        value: ${{ jobs.allocate.outputs.allocation-sha256 }}
      release-version:
        description: Allocated SemVer release version without the v tag prefix.
        value: ${{ jobs.allocate.outputs.release-version }}
      python-version:
        description: Allocated canonical PEP 440 version for native version injection.
        value: ${{ jobs.allocate.outputs.python-version }}
      source-sha:
        description: Full original push event commit SHA to build.
        value: ${{ jobs.allocate.outputs.source-sha }}
      tag:
        description: Exact immutable annotated release tag.
        value: ${{ jobs.allocate.outputs.tag }}
      build-required:
        description: String true when this event has no immutable verified build record.
        value: ${{ jobs.allocate.outputs.build-required }}
      artifact-id:
        description: Original verified build artifact ID, or empty before the first build.
        value: ${{ jobs.allocate.outputs.artifact-id }}
permissions:
  contents: read
jobs:
  allocate:
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release-allocation
      queue: max
    outputs:
      allocation: ${{ steps.allocate.outputs.allocation }}
      allocation-sha256: ${{ steps.allocate.outputs.allocation-sha256 }}
      release-version: ${{ steps.allocate.outputs.release-version }}
      python-version: ${{ steps.allocate.outputs.python-version }}
      source-sha: ${{ steps.allocate.outputs.source-sha }}
      tag: ${{ steps.allocate.outputs.tag }}
      build-required: ${{ steps.allocate.outputs.build-required }}
      artifact-id: ${{ steps.allocate.outputs.artifact-id }}
    steps:
      - name: Verify the executing provider pin before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER_REF: ${{ inputs.provider-ref }}
        run: |
          set -euo pipefail
          [[ "$PROVIDER_REF" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/provider-run.json"
          jq --exit-status --arg ref "$PROVIDER_REF" \
            --arg workflow "pokerlost/.github/.github/workflows/python-allocate.yml" '
            [.referenced_workflows[] | select(.path | startswith($workflow + "@"))]
            | unique_by([.path, .sha]) as $refs
            | ($refs | length) == 1 and $refs[0].sha == $ref
              and $refs[0].path == ($workflow + "@" + $ref)
          ' "$RUNNER_TEMP/provider-run.json"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: pokerlost/.github
          ref: ${{ inputs.provider-ref }}
          path: provider
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the provider verifier dependency
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            --disable-pip-version-check -r provider/scripts/python-verifier-requirements.txt
      - name: Allocate the checked original Python event
        id: allocate
        run: node provider/scripts/python_release.mjs allocate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ADAPTER: python
          RELEASE_PROVIDER_REF: ${{ inputs.provider-ref }}
          RELEASE_SCHEMA: ${{ inputs.schema-version }}
          RELEASE_WORKFLOW: ${{ inputs.source-workflow }}
          RELEASE_GATE: ${{ inputs.preflight-gate }}
          RELEASE_BUILDER: ${{ inputs.builder-job }}
          RELEASE_BUNDLE_NAME: ${{ inputs.package-name }}
          RELEASE_VERSION_TARGET: ${{ inputs.version-target }}
          RELEASE_WHEEL_TAGS: ${{ inputs.wheel-tags }}

name: Reusable verified Python publication
on:
  workflow_call:
    inputs:
      provider-ref:
        description: Reviewed full provider SHA, identical to this reusable workflow pin.
        required: true
        type: string
      schema-version:
        description: Exact supported contract schema, h02-python/v1.
        required: true
        type: string
      source-workflow:
        description: Original caller workflow path, including .github/workflows/.
        required: true
        type: string
      preflight-gate:
        description: Exact successful native preflight job name in this original run attempt.
        required: true
        type: string
      builder-job:
        description: Exact successful G01-owned native builder job name in this run attempt.
        required: true
        type: string
      package-name:
        description: Native Python distribution name; metadata must match it.
        required: true
        type: string
      version-target:
        description: Reviewed native release target in strict X.Y.Z SemVer form.
        required: true
        type: string
      wheel-tags:
        description: JSON array of the exact expected expanded PEP 425 compatibility tags.
        required: true
        type: string
      artifact-id:
        description: Exact immutable GitHub artifact ID produced by the native builder.
        required: true
        type: string
      allocation:
        description: Exact allocation JSON emitted by python-allocate.yml for this event.
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - name: Verify the executing provider pin before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER_REF: ${{ inputs.provider-ref }}
        run: |
          set -euo pipefail
          [[ "$PROVIDER_REF" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/provider-run.json"
          jq --exit-status --arg ref "$PROVIDER_REF" \
            --arg workflow "pokerlost/.github/.github/workflows/python-publish.yml" '
            [.referenced_workflows[] | select(.path | startswith($workflow + "@"))]
            | unique_by([.path, .sha]) as $refs
            | ($refs | length) == 1 and $refs[0].sha == $ref
              and $refs[0].path == ($workflow + "@" + $ref)
          ' "$RUNNER_TEMP/provider-run.json"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: pokerlost/.github
          ref: ${{ inputs.provider-ref }}
          path: provider
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the provider verifier dependency
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            --disable-pip-version-check -r provider/scripts/python-verifier-requirements.txt
      - name: Verify the original build with read-only permissions
        run: node provider/scripts/python_release.mjs verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ADAPTER: python
          RELEASE_PROVIDER_REF: ${{ inputs.provider-ref }}
          RELEASE_SCHEMA: ${{ inputs.schema-version }}
          RELEASE_WORKFLOW: ${{ inputs.source-workflow }}
          RELEASE_GATE: ${{ inputs.preflight-gate }}
          RELEASE_BUILDER: ${{ inputs.builder-job }}
          RELEASE_BUNDLE_NAME: ${{ inputs.package-name }}
          RELEASE_VERSION_TARGET: ${{ inputs.version-target }}
          RELEASE_WHEEL_TAGS: ${{ inputs.wheel-tags }}
          RELEASE_ARTIFACT_ID: ${{ inputs.artifact-id }}
          RELEASE_ALLOCATION: ${{ inputs.allocation }}
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      attestations: read
    concurrency:
      group: release-allocation
      queue: max
    steps:
      - name: Verify the executing provider pin before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER_REF: ${{ inputs.provider-ref }}
        run: |
          set -euo pipefail
          [[ "$PROVIDER_REF" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/provider-run.json"
          jq --exit-status --arg ref "$PROVIDER_REF" \
            --arg workflow "pokerlost/.github/.github/workflows/python-publish.yml" '
            [.referenced_workflows[] | select(.path | startswith($workflow + "@"))]
            | unique_by([.path, .sha]) as $refs
            | ($refs | length) == 1 and $refs[0].sha == $ref
              and $refs[0].path == ($workflow + "@" + $ref)
          ' "$RUNNER_TEMP/provider-run.json"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: pokerlost/.github
          ref: ${{ inputs.provider-ref }}
          path: provider
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the provider verifier dependency
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            --disable-pip-version-check -r provider/scripts/python-verifier-requirements.txt
      - name: Reverify immutable bytes and publish the allocated release
        run: node provider/scripts/python_release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ADAPTER: python
          RELEASE_PROVIDER_REF: ${{ inputs.provider-ref }}
          RELEASE_SCHEMA: ${{ inputs.schema-version }}
          RELEASE_WORKFLOW: ${{ inputs.source-workflow }}
          RELEASE_GATE: ${{ inputs.preflight-gate }}
          RELEASE_BUILDER: ${{ inputs.builder-job }}
          RELEASE_BUNDLE_NAME: ${{ inputs.package-name }}
          RELEASE_VERSION_TARGET: ${{ inputs.version-target }}
          RELEASE_WHEEL_TAGS: ${{ inputs.wheel-tags }}
          RELEASE_ARTIFACT_ID: ${{ inputs.artifact-id }}
          RELEASE_ALLOCATION: ${{ inputs.allocation }}
